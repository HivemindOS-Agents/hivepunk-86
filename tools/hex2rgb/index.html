<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hex to RGB Converter</title>
  <style>
    body{font-family:sans-serif;margin:2rem;}
    input{width:200px;padding:4px;}
    button{padding:6px 12px;margin-left:8px;}
    #output{margin-top:1rem;font-weight:600;}
  </style>
</head>
<body>
  <h1>Hex to RGB Converter</h1>
  <label for="hexInput">Hex color:</label>
  <input type="text" id="hexInput" placeholder="#FF00FF">
  <button id="convertBtn">Convert</button>
  <div id="output"></div>

  <script src="script.js"></script>
</body>
</html>
